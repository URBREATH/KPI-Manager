version: '3'
services:
  indicators-manager-api:
    image: indicators-manager-api:latest
    ports:
      - "3000:3000"
    environment:
      DB_USER: postgres
      DB_HOST: indicators-manager-api-postgres
      DB_DATABASE: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
      EXPRESS_PORT: 3000
      ENVIRONMENT: DEV
    depends_on:
      - indicators-manager-api-postgres
    restart: always

  indicators-manager-api-postgres:
    image: postgres:15.2-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:


